name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.build.name }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        build:
          - name: iOS
            action: test-ios
            logfiles: raw-*-ios.log
            platform: iOS
            simulator-prefix: IOS
            device: iPhone 17 Pro
          - name: macOS
            action: test-macos
            logfiles: raw-*-macos.log
          - name: Mac Catalyst
            action: test-maccatalyst
            logfiles: raw-*-maccatalyst.log
          - name: tvOS
            action: test-tvos
            logfiles: raw-*-tvos.log
            platform: tvOS
            simulator-prefix: TVOS
            device: Apple TV 4K (3rd generation)
          - name: watchOS
            action: test-watchos
            logfiles: raw-*-watchos.log
            platform: watchOS
            simulator-prefix: WATCHOS
            device: Apple Watch Series 11 (46mm)
          - name: visionOS
            action: test-visionos
            logfiles: raw-*-visionos.log
            platform: visionOS
            simulator-prefix: VISION_OS
            device: Apple Vision Pro
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensuring required simulator runtimes are loaded
        id: simulator
        if: matrix.build.platform != null
        uses: kula-app/wait-for-services-action/ios-simulator@v1
        with:
          platform: ${{ matrix.build.platform }}
          device: ${{ matrix.build.device }}
          boot: true
          timeout: 300

      - name: Configure simulator destination
        if: matrix.build.platform != null
        env:
          SIMULATOR_PREFIX: ${{ matrix.build.simulator-prefix }}
          OS_VERSION: ${{ steps.simulator.outputs.runtime }}
          DEVICE_NAME: ${{ matrix.build.device }}
        run: |
          echo "${SIMULATOR_PREFIX}_SIMULATOR_OS=$OS_VERSION" >> "$GITHUB_ENV"
          echo "${SIMULATOR_PREFIX}_DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"

      - name: Run Tests
        run: make ${{ matrix.build.action }}

      - name: Upload test log file on error
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Test Logs - ${{ matrix.build.name }}
          path: ${{ matrix.build.logfiles }}

      - name: Run CI Diagnostics
        if: failure()
        run: bash scripts/ci-diagnostics.sh

name: Example UI Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Example launch (iOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Prepare iOS Simulator
        id: simulator
        uses: kula-app/wait-for-services-action/ios-simulator@v1
        with:
          platform: iOS
          device: iPhone 17 Pro
          boot: true
          timeout: 300

      - name: Run example smoke test
        env:
          IOS_SIMULATOR_OS: ${{ steps.simulator.outputs.runtime }}
          IOS_DEVICE_NAME: iPhone 17 Pro
        run: make test-example-ios

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Example UI Test Diagnostics
          path: |
            raw-test-example-ios.log
            build/ExampleUITests/*.xcresult
